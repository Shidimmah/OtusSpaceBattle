global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'battle_mechanics'
    static_configs:
      - targets: ['battle_mechanics:8001']

  - job_name: 'resource_management'
    static_configs:
      - targets: ['resource_management:8002']

  - job_name: 'ranking'
    static_configs:
      - targets: ['ranking:8003']

  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics:8004']

  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 