version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api_gateway
      - battle_mechanics
      - resource_management
      - ranking
      - analytics
    networks:
      - app_network

  battle_mechanics:
    build:
      context: .
      dockerfile: otus_space_battle/services/battle_mechanics/Dockerfile
    expose:
      - "8001"
      - "9001"
    environment:
      - SERVICE_NAME=battle_mechanics
      - METRICS_PORT=9001
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  resource_management:
    build:
      context: .
      dockerfile: otus_space_battle/services/resource_management/Dockerfile
    expose:
      - "8002"
      - "9002"
    environment:
      - SERVICE_NAME=resource_management
      - METRICS_PORT=9002
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  ranking:
    build:
      context: .
      dockerfile: otus_space_battle/services/ranking/Dockerfile
    expose:
      - "8003"
      - "9003"
    environment:
      - SERVICE_NAME=ranking
      - METRICS_PORT=9003
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  analytics:
    build:
      context: .
      dockerfile: otus_space_battle/services/analytics/Dockerfile
    expose:
      - "8004"
      - "9004"
    environment:
      - SERVICE_NAME=analytics
      - METRICS_PORT=9004
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  api_gateway:
    build:
      context: .
      dockerfile: otus_space_battle/services/api_gateway/Dockerfile
    expose:
      - "8000"
      - "9000"
    environment:
      - SERVICE_NAME=api_gateway
      - METRICS_PORT=9000
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - battle_mechanics
      - resource_management
      - ranking
      - analytics
    networks:
      - app_network

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=space_battle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.3
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app_network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.9.3
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - app_network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.9.3
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data: 