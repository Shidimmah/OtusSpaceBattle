version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - api_gateway
      - battle_mechanics
      - resource_management
      - ranking
      - analytics
    networks:
      - app_network

  battle_mechanics:
    build:
      context: .
      dockerfile: otus_space_battle/services/battle_mechanics/Dockerfile
    expose:
      - "8001"
      - "9001"
    environment:
      - SERVICE_NAME=battle_mechanics
      - METRICS_PORT=9001
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  resource_management:
    build:
      context: .
      dockerfile: otus_space_battle/services/resource_management/Dockerfile
    expose:
      - "8002"
      - "9002"
    environment:
      - SERVICE_NAME=resource_management
      - METRICS_PORT=9002
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  ranking:
    build:
      context: .
      dockerfile: otus_space_battle/services/ranking/Dockerfile
    expose:
      - "8003"
      - "9003"
    environment:
      - SERVICE_NAME=ranking
      - METRICS_PORT=9003
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  analytics:
    build:
      context: .
      dockerfile: otus_space_battle/services/analytics/Dockerfile
    expose:
      - "8004"
      - "9004"
    environment:
      - SERVICE_NAME=analytics
      - METRICS_PORT=9004
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - db
      - prometheus
    networks:
      - app_network

  api_gateway:
    build:
      context: .
      dockerfile: otus_space_battle/services/api_gateway/Dockerfile
    expose:
      - "8000"
      - "9000"
    environment:
      - SERVICE_NAME=api_gateway
      - METRICS_PORT=9000
      - DB_URL=postgresql://postgres:postgres@db:5432/space_battle
    depends_on:
      - battle_mechanics
      - resource_management
      - ranking
      - analytics
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    expose:
      - "9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - app_network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    expose:
      - "5601"
    depends_on:
      - elasticsearch
    networks:
      - app_network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - app_network

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=space_battle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=2gb
      - cluster.routing.allocation.disk.watermark.high=1gb
      - cluster.routing.allocation.disk.watermark.flood_stage=500mb
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - app_network

  elasticsearch_setup:
    image: curlimages/curl:latest
    volumes:
      - ./scripts:/scripts
    command: ["/bin/sh", "/scripts/setup_elasticsearch.sh"]
    depends_on:
      - elasticsearch
    networks:
      - app_network

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  postgres_data:

networks:
  app_network:
    driver: bridge 