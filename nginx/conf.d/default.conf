upstream api_gateway {
    server api_gateway:8000;
}

upstream battle_mechanics {
    server battle_mechanics:8001;
}

upstream resource_management {
    server resource_management:8002;
}

upstream ranking {
    server ranking:8003;
}

upstream analytics {
    server analytics:8004;
}

upstream prometheus {
    server prometheus:9090;
}

upstream grafana {
    server grafana:3000;
}

upstream kibana {
    server kibana:5601;
}

server {
    listen 80;
    server_name _;

    # Основной API шлюз
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Исправляем пути для Swagger UI
        sub_filter_types *;
        sub_filter_once off;
        sub_filter 'url: "/openapi.json"' 'url: "/api/openapi.json"';
        sub_filter '"url": "/' '"url": "/api/';
        sub_filter '@' '%40';
    }

    # Сервис боевой механики
    location /battle/ {
        proxy_pass http://battle_mechanics/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Сервис управления ресурсами
    location /resources/ {
        proxy_pass http://resource_management/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Сервис рейтинга
    location /ranking/ {
        proxy_pass http://ranking/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Сервис аналитики
    location /analytics/ {
        proxy_pass http://analytics/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Система мониторинга Prometheus
    location /prometheus/ {
        proxy_pass http://prometheus/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Система визуализации Grafana
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Система логирования Kibana
    location /kibana/ {
        proxy_pass http://kibana/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
} 