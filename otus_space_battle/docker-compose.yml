version: "3.8"

services:
  api_gateway:
    build: ./services/api_gateway
    container_name: otus_api_gateway
    ports:
      - "80:8000"
    depends_on:
      - auth_service

  auth_service:
    build: ./services/auth_service
    container_name: otus_auth_service
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db/auth_db
    ports:
      - "8001:8001"

  db:
    image: postgres:13
    container_name: otus_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
