test_service:
  build:
    context: ./services/test_service
    dockerfile: Dockerfile
  container_name: test_service
  volumes:
    - ./services:/app/services
    - ./common:/app/common
    - ./reports:/app/reports
  networks:
    - space_battle_network
  depends_on:
    - api_gateway
    - auth_service
    - battle_mechanics
    - matchmaking
    - ranking
    - resource_management
    - analytics
    - postgres
    - elasticsearch
  environment:
    - API_GATEWAY_URL=http://api_gateway:8000
    - AUTH_SERVICE_URL=http://auth_service:8000
    - BATTLE_MECHANICS_URL=http://battle_mechanics:8000
    - MATCHMAKING_URL=http://matchmaking:8000
    - RANKING_URL=http://ranking:8000
    - RESOURCE_MANAGEMENT_URL=http://resource_management:8000
    - ANALYTICS_URL=http://analytics:8000
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - ELASTICSEARCH_HOST=elasticsearch
    - ELASTICSEARCH_PORT=9200 