global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'battle_mechanics'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'

  - job_name: 'resource_management'
    static_configs:
      - targets: ['localhost:8002']
    metrics_path: '/metrics'

  - job_name: 'ranking'
    static_configs:
      - targets: ['localhost:8003']
    metrics_path: '/metrics'

  - job_name: 'analytics'
    static_configs:
      - targets: ['localhost:8004']
    metrics_path: '/metrics' 