name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version
    
    - name: Prepare test environment
      run: |
        # Создаем необходимые директории
        mkdir -p common/models common/utils
        # Копируем common для тестов
        cp -r otus_space_battle/common/models/* common/models/
        cp -r otus_space_battle/common/utils/* common/utils/
        # Создаем директорию для отчетов
        mkdir -p reports
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e otus_space_battle/
    
    - name: Start services
      run: |
        docker-compose build --progress=plain
        docker-compose up -d
        docker-compose ps
        docker-compose logs
        # Ждем, пока все сервисы станут доступны
        chmod +x ./scripts/wait_for_services.sh
        ./scripts/wait_for_services.sh
    
    - name: Run tests
      run: |
        # Запускаем тесты через Docker
        docker-compose up --exit-code-from test_service --abort-on-container-exit test_service
        
        # Проверяем результаты тестов
        if [ -f reports/coverage_summary.txt ]; then
          cat reports/coverage_summary.txt
          COVERAGE=$(grep -oP 'Total coverage: \K\d+\.\d+' reports/coverage_summary.txt)
          # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          #   echo "Покрытие кода меньше 80%"
          #   exit 1
          # fi
        else
          echo "Не найден отчет о покрытии кода"
          exit 1
        fi
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          reports/coverage.xml
          reports/html_coverage/
          reports/coverage_summary.txt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
        scp -i ~/.ssh/deploy_key -r ./* $SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/space-battle/
        ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "cd /home/$SERVER_USER/space-battle && ./deploy.sh" 