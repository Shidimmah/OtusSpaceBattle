name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov requests
    
    - name: Start services
      run: |
        docker-compose up -d
        # Ждем, пока все сервисы станут доступны
        ./scripts/wait_for_services.sh
    
    - name: Run tests
      run: |
        pytest --cov=src --cov-report=term-missing
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        # Устанавливаем SSH ключ
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Добавляем сервер в known_hosts
        ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
        
        # Копируем файлы на сервер
        scp -i ~/.ssh/deploy_key -r ./* $SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/space-battle/
        
        # Запускаем скрипт деплоя
        ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST 'cd /home/$SERVER_USER/space-battle && ./deploy.sh' 