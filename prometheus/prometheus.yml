global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']

  - job_name: 'auth_service'
    static_configs:
      - targets: ['auth_service:8000']

  - job_name: 'battle_mechanics'
    static_configs:
      - targets: ['battle_mechanics:8000']

  - job_name: 'resource_management'
    static_configs:
      - targets: ['resource_management:8000']

  - job_name: 'ranking'
    static_configs:
      - targets: ['ranking:8000']

  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics:8000']

  - job_name: 'game_session'
    static_configs:
      - targets: ['game_session:8000']

  - job_name: 'matchmaking'
    static_configs:
      - targets: ['matchmaking:8000']

  - job_name: 'fleet_management'
    static_configs:
      - targets: ['fleet_management:8000'] 